kind = "mobile"
previewPath = "/"
title = "ARISE: The Solo Leaving"
description = "A mobile-first SSC CGL study training system that turns daily preparation into safe, game-like quests with persistent progress, XP, levels, streaks, and phase unlocks."
version = "1.0.0"
id = "artifacts/arise-study-system"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22036

[services.development]
run = "pnpm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arise-study-system", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/arise-study-system", "run", "serve" ]

[services.env]
PORT = "22036"
BASE_PATH = "/"
